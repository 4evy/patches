name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  documentation:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.user.id == 49699333 ||
      github.event.pull_request.user.id == 29139614 ||
      github.event.pull_request.user.id == 41898282
    name: Documentation quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.{md,markdown}'
      - name: Compute the link-cache scope
        id: link-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache link-check responses
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: >-
            lychee-v1-${{ runner.os }}-${{ steps.link-cache.outputs.week
            }}-${{ hashFiles('**/*.md', '**/*.markdown', '**/*.html') }}
          restore-keys: |
            lychee-v1-${{ runner.os }}-${{ steps.link-cache.outputs.week }}-
            lychee-v1-${{ runner.os }}-
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose --no-progress --cache --max-cache-age 1d '**/*.md'
            '**/*.markdown' '**/*.html'
