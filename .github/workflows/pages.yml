name: Build website

on:
  push:
    branches: [master]
    paths:
      - 'stacks/**'
      - 'website/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/website-check.sh'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'stacks/**'
      - 'website/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/website-check.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  verify:
    name: Verify Node website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check and build website
        run: |
          npm run check
          npm run build
      - name: Test runtime discovery and HTML
        run: npm run test:website
