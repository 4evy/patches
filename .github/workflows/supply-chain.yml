name: Supply chain

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: sh

env:
  IMAGE_NAME: ghcr.io/4evy/patches

jobs:
  sbom:
    name: Inspect development image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: 4evy/patches:ci
          build-args: |
            BUILD_VERSION=ci
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=patches-image
          cache-to: type=gha,mode=max,scope=patches-image
      - name: Generate an image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: 4evy/patches:ci
          artifact-name: patches-sbom.spdx.json
          output-file: patches-sbom.spdx.json
          upload-artifact-retention: 14
          upload-release-assets: false

  release:
    name: Publish and attest release image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      artifact-metadata: write # Link the pushed image to its attestations.
      attestations: write # Publish provenance and SBOM attestations.
      contents: read
      id-token: write # Mint the OIDC identity used by attest and Cosign.
      packages: write # Push the image and its registry attestations.
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push the release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=patches-image
          cache-to: type=gha,mode=max,scope=patches-image
      - name: Generate a release image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          artifact-name: patches-${{ github.ref_name }}.spdx.json
          output-file: patches-${{ github.ref_name }}.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest the image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: patches-${{ github.ref_name }}.spdx.json
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the immutable image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_NAME@$IMAGE_DIGEST"
