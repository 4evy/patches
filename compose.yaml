services:
  patches:
    image: ${PATCHES_IMAGE:-4evy/patches:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: local
    init: true
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: 'no'
